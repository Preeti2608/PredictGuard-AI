name: PredictGuard AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Code Quality & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type Check with Mypy
        run: |
          mypy app

      - name: Run Pytest with Coverage
        run: |
          pytest tests --cov=app --cov-report=xml --cov-report=term-missing

      - name: Verify API Integration Test Suite
        run: |
          python test_api_endpoints.py

  docker-build:
    name: Docker Image Build & Verification
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: predictguard-ai:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
